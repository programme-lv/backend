name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: proglv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d proglv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: pw
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: go test -tags=integration ./...
